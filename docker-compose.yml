services:
  app:
    build: .
    container_name: transporte-urbs-ingestor-app
    volumes:
      - .:/app
      - ./alembic:/app/alembic
      - ${CRAWLER_DIR:-/mnt/shared/jhonatan/Development/crawler-dadosabertos-cwb}:/app/crawler:rw
    networks:
      - urbs_internal
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-urbs_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-urbs_db}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      CRAWLER_OUTPUT_PATH: ${CRAWLER_OUTPUT_PATH:-/app/crawler/downloads}
      INGESTION_SCHEDULE: ${INGESTION_SCHEDULE:-02:00}
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: transporte-urbs-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-urbs_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-urbs_db}
    volumes:
      - urbs_pg_data:/var/lib/postgresql/data
    networks:
      urbs_internal:
        ipv4_address: 172.28.1.2
    restart: unless-stopped

networks:
  urbs_internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  urbs_pg_data: